name: Build & Release

# One Ubuntu runner (cheapest minutes): tests, then the Windows .exe
# cross-compiled with mingw. When the version in Cargo.toml has no matching
# vX.Y.Z release yet, the .exe is published as that release; the in-app update
# checker reads the latest release, so bumping the version is all it takes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  APP: FLMLDesk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ github.ref }}" = "refs/heads/main" ] \
             && ! gh release view "v$version" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Will publish v$version"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      # Downloaded .deb files are kept in the Actions cache, so most runs don't
      # download the packages from a mirror at all (apt still checks each file
      # against the package index).
      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: apt-${{ runner.os }}-

      - name: System dependencies
        timeout-minutes: 15
        run: |
          # The runner's default mirror (azure.archive.ubuntu.com) sometimes
          # serves packages at a few kB/s (actions/runner-images#14823). apt
          # only leaves a mirror that errors or sends nothing, never a slow
          # one, so list several mirrors with Azure last, give every attempt a
          # time limit, and drop the first mirror before retrying.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\tpriority:%s\n' \
              https://archive.ubuntu.com/ubuntu/ 1 \
              https://mirrors.edge.kernel.org/ubuntu/ 2 \
              https://mirrors.mit.edu/ubuntu/ 3 \
              http://azure.archive.ubuntu.com/ubuntu/ 4 \
              https://security.ubuntu.com/ubuntu/ 5 | sudo tee /etc/apt/apt-mirrors.txt
          else
            sudo sed -i 's|http://azure\.archive\.ubuntu\.com|http://archive.ubuntu.com|g' \
              /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          fi
          mkdir -p ~/apt-archives/partial
          apt="apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
            -o Dir::Cache::Archives=$HOME/apt-archives/"
          packages="mingw-w64 libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgtk-3-dev libssl-dev"
          for attempt in 1 2 3; do
            if sudo timeout 120 $apt update && sudo timeout 240 $apt install -y --no-install-recommends $packages; then
              sudo chown -R "$USER" ~/apt-archives
              exit 0
            fi
            echo "apt attempt $attempt failed or was too slow; retrying without the first mirror"
            sudo dpkg --configure -a || true
            sudo sed -i '1d' /etc/apt/apt-mirrors.txt 2>/dev/null || true
          done
          exit 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked --release

      - name: Build Windows
        run: cargo build --locked --release --target x86_64-pc-windows-gnu

      - name: Package
        run: |
          mkdir -p dist
          cp "target/x86_64-pc-windows-gnu/release/$APP.exe" "dist/$APP-v${{ steps.meta.outputs.version }}-windows-x64.exe"
          cp THIRD_PARTY_NOTICES.md LICENSES/*.txt dist/
          cd dist
          sha256sum * > SHA256SUMS.txt
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: FLMLDesk-v${{ steps.meta.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Release
        if: steps.meta.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: FL ML Desk v${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*
