name: Build & Release

# One Ubuntu runner (cheapest minutes): tests, a native Linux build and a
# cross-compiled Windows build. When the version in Cargo.toml has no matching
# vX.Y.Z release yet, the binaries are published as that release; the in-app
# update checker reads the latest release, so bumping the version is all it takes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  APP: FLMLDesk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ github.ref }}" = "refs/heads/main" ] \
             && ! gh release view "v$version" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Will publish v$version"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libgtk-3-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked --release

      - name: Build Linux
        run: cargo build --locked --release

      - name: Build Windows
        run: cargo build --locked --release --target x86_64-pc-windows-gnu

      - name: Package
        run: |
          version="${{ steps.meta.outputs.version }}"
          mkdir -p dist
          stage() {  # stage <platform> <binary>; prints the staged folder name
            name="$APP-v$version-$1"
            mkdir -p "dist/$name"
            cp "$2" README.md THIRD_PARTY_NOTICES.md "dist/$name/"
            cp -r LICENSES "dist/$name/"
            echo "$name"
          }
          win=$(stage windows-x64 "target/x86_64-pc-windows-gnu/release/$APP.exe")
          linux=$(stage linux-x64 "target/release/$APP")
          cd dist
          zip -qr "$win.zip" "$win"
          tar czf "$linux.tar.gz" "$linux"
          rm -rf "$win" "$linux"
          sha256sum * > SHA256SUMS.txt
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: FLMLDesk-v${{ steps.meta.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Release
        if: steps.meta.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: FL ML Desk v${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*
