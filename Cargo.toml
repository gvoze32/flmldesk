[package]
name = "fl-ml-desk"
version = "0.2.6"
edition = "2024"
rust-version = "1.89"
description = "Master League transfer & budget editor for Football Life 2026 / PES 2021 saves"
# The update checker reads releases from this GitHub repository.
repository = "https://github.com/gvoze32/flmldesk"

[[bin]]
name = "FLMLDesk"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dependencies]
chrono = "0.4.45"
eframe = "0.37.0"
egui_extras = "0.37.0"
flate2 = "1.1.10"
memchr = "2.8.3"
memmap2 = "0.9.12"
regex = "1.13.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
unicode-normalization = "0.1.26"
ureq = "3.5.0"

[build-dependencies]
embed-resource = "3.0.12"
